[package]
name = "indoor-planner-license-generator"
version = "1.0.0"
edition = "2021"
description = "Offline publisher license generator for Indoor Planner"

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_HiDpi",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"
] }

[build-dependencies]
tauri-winres = "0.3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
