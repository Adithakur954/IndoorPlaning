[package]
name = "indoor-sim-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tower-http = { version = "0.6", features = ["cors"] }
rusqlite = { version = "0.38", features = ["bundled"] }
ed25519-dalek = "2"
base64 = "0.22"
# The Wi-Fi capacity engine; the planner runs the same crate as WebAssembly.
capacity-core = { path = "../capacity" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
